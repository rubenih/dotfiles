background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 100
    font_family = Noto Sans Bold
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:43200000] LC_TIME=es_ES.UTF-8 echo "$(date +'%A, %d de %B')"
    font_size = 24
    font_family = Noto Sans
    position = 0, 150
    halign = center
    valign = center
    color = rgba(255, 255, 255, 0.7)
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    rounding = -1 # Esto lo hace circular
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}
