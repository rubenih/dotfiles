##############################
# 🎨 Apariencia
##############################

font_family JetBrains Mono
font_size 11.0

# Transparencia
background_opacity 0.4

# Sin campanita molesta
enable_audio_bell no

# No preguntar al cerrar
confirm_os_window_close 0

##############################
# 🧩 Tabs
##############################

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 1

# Keybinds tabs
map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

##############################
# 🪟 Splits (ventanas internas)
##############################

# Vertical split
map ctrl+enter launch --location=vsplit

# Horizontal split
map ctrl+shift+enter launch --location=hsplit

##############################
# 🧭 Navegación tipo Vim
##############################

map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down

##############################
# ⚙️ Comportamiento
##############################

# Abrir nuevas ventanas en el mismo directorio
map ctrl+shift+n launch --cwd=current

# Scroll más cómodo
scrollback_lines 10000

##############################
# ✨ Calidad de vida
##############################

# Mejor selección con ratón
mouse_hide_wait 3.0

# Copiar automáticamente al seleccionar (opcional)
copy_on_select yes

##############################
# 🖼️ Render
##############################

# Mejora renderizado (suele ir bien en Wayland)
repaint_delay 10
input_delay 3
sync_to_monitor yes
